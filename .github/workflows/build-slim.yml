---
name: "Build Slim Container"

# Builds the multi-stage production image from Dockerfile.slim and publishes it
# as ghcr.io/<owner>/<repo>:slim. Run it manually from the Actions tab, or push
# a tag that starts with "slim-".
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC, after the weekly auto-rebase
  push:
    tags:
      - 'slim-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (arch)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          NEXT_PUBLIC_VERSION: slim
        run: |
          IMAGE="${IMAGE,,}"
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.slim \
            -t "$IMAGE:slim-${{ matrix.arch }}" \
            --build-arg NEXT_PUBLIC_VERSION="$NEXT_PUBLIC_VERSION" \
            --pull \
            --provenance=false --sbom=false \
            --output "type=registry,name=$IMAGE:slim-${{ matrix.arch }}" .

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push :slim manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          docker manifest rm "$IMAGE:slim" || true
          docker manifest create "$IMAGE:slim" \
            --amend "$IMAGE:slim-amd64" \
            --amend "$IMAGE:slim-arm64"
          docker manifest push "$IMAGE:slim"
